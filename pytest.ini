# Pytest configuration for Claus-Bridge.
#
# WHY pytest.ini AND NOT pyproject.toml
# -------------------------------------
# Railway builds this repo with railpack (0.38.0, verified in the build log),
# whose Python provider decides how to install the app by SNIFFING THE FILES IN
# THE REPO ROOT. Today it reports:
#
#     Detected Python / Using pip / $ pip install -r requirements.txt
#
# `pyproject.toml` is one of the files that provider looks at when it picks a
# package manager and an install command. Dropping one into the root to hold
# nothing but pytest settings puts a new input in front of the production build
# — and this repo auto-deploys from `main` with no gate in between. The upside
# of pyproject.toml here is cosmetic (this is an app, not a distributable
# package: there is no [project] table to write, nothing to build, nothing to
# publish). The downside is a build-system change on a service that deploys
# straight to production. pytest.ini has zero detection surface, and as the
# highest-precedence pytest config file it also pins rootdir unambiguously.
#
# If this repo ever becomes a real package, move these settings into
# pyproject.toml *in the same change* that adds a [build-system] table and
# verifies the railpack build plan is still `pip install -r requirements.txt`.

[pytest]

# Only tests/ is the suite. This is load-bearing, not tidiness:
#   - recon/            168 test files of a VENDORED third-party library (edsl)
#   - vertical_plugins/ 7 files named test_*.py that are actually manual
#                       scripts hitting live SiliconFlow and brave-mcp-server
#                       on Railway (see test_kimi_with_brave.py's docstring)
#   - pyramid/test_pyramid.py  talks to BRIDGE_DB_PATH directly
# A bare `pytest` from the repo root would try to import all of them.
testpaths = tests

# Put the repo root on sys.path so `import plugins.x`, `import server`,
# `import youngereka_chat` resolve without every test file bootstrapping its
# own path. 17 files under tests/ currently open with a hand-rolled
# sys.path.insert(...) of the repo root; this makes every one of them a no-op.
# They are deliberately LEFT IN PLACE for now — deleting 17 files' worth of
# imports on the same day the config lands means a mistake here breaks all of
# them at once. Removing them is a separate, mechanical follow-up.
pythonpath = .

# Belt and braces for the testpaths line above, so an explicit `pytest .` or a
# stray rootdir cannot wander into the vendored library or the 40MB blob.
norecursedirs =
    .git
    .venv
    __pycache__
    backups
    config
    data
    orakel_backteszt*
    prompts
    recon
    uploads
    vertical_plugins
    yt_title_test

# -ra prints the reason for every skip/xfail at the end of the run, so a test
# that opts out of CI says so out loud instead of blending into the dots.
# --strict-markers turns a typo'd @pytest.mark.netwrok into an error rather
# than a decorator that silently does nothing.
addopts = -ra --strict-markers

markers =
    network: test makes real outbound network calls. NOT run in CI; the
        network guard in tests/conftest.py blocks sockets for every test
        without this marker. Requires real credentials to be meaningful.
